name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libavcodec-dev libavutil-dev libva-dev libdrm-dev libegl-dev libgles-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          name=luch-linux-${GITHUB_REF_NAME//\//-}-x86_64
          mkdir -p "$name/bin"
          cp target/release/{luchd,luchctl,luch-kms} "$name/bin/"
          cp -r contrib docs README.md README.ru.md LICENSE "$name/"
          (cd gnome-extension/luch@toxblh.github.io && zip -qr "$GITHUB_WORKSPACE/luch@toxblh.github.io.shell-extension.zip" .)
          cp "luch@toxblh.github.io.shell-extension.zip" "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "PKG=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: luch-linux
          path: |
            ${{ env.PKG }}
            luch@toxblh.github.io.shell-extension.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$PKG" "luch@toxblh.github.io.shell-extension.zip" --generate-notes
