name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["luch-win/**", "luch-proto/**", "Cargo.toml", "Cargo.lock", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["luch-win/**", "luch-proto/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p luch-win --release --locked
      - name: Test
        run: cargo test -p luch-win --release --locked
      - name: Package
        shell: bash
        run: |
          name="luch-win-${GITHUB_REF_NAME//\//-}-x86_64"
          mkdir -p "$name"
          cp target/release/luch-win.exe "$name/"
          cp docs/windows.md LICENSE "$name/"
          7z a "$name.zip" "$name" >/dev/null
          echo "PKG=$name.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: luch-windows
          path: ${{ env.PKG }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "$PKG" --clobber
