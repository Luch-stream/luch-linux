[package]
name = "luch-win"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Luch sender for Windows: Desktop Duplication -> D3D11 NV12 -> hardware H.264/HEVC -> Luch v1 UDP"

[dependencies]
luch-proto.workspace = true
serde_json = "1"
socket2 = { version = "0.6.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
uuid = { version = "1", features = ["v4"] }

# The capture, encode and audio code. Everything else builds and tests on Linux.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Media_MediaFoundation",
    "Win32_NetworkManagement_QoS",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Graphics_Capture",
]
