[package]
name = "luchd"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
luch-proto.workspace = true
zbus.workspace = true
tokio.workspace = true
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
futures-util = "0.3"
gstreamer = "0.25.4"
gstreamer-app = { version = "0.25.2", features = ["v1_24"] }
gstreamer-video = "0.25.4"
ashpd = { version = "0.14.1", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
socket2 = { version = "0.6.5", features = ["all"] }
gstreamer-allocators = "0.25.4"
tokio-tungstenite = "0.27"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13.2"
# Relaying a link for a receiver (cast.rs): HTTPS to sites, streamed through.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[build-dependencies]
cc = "1.11.3"
pkg-config = "0.3.34"
