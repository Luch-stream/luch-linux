app-id: toxblh.luch.Luch
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: luchd

finish-args:
  - --share=network
  - --socket=pulseaudio
  - --device=dri
  # Receivers are found through the system Avahi daemon.
  - --system-talk-name=org.freedesktop.Avahi
  # The screen-sharing portal (modes monitor, window, virtual).
  - --talk-name=org.freedesktop.portal.Desktop
  # Front-ends (Niri's panel, Tuner, luchctl) talk to luchd on the session bus.
  - --own-name=dev.luch.Luch1
  # luch-setup runs a few commands on the host (the Decky plugin folder needs root): see deck/luch-setup.
  - --talk-name=org.freedesktop.Flatpak
  # luchd keeps the screen awake while it streams.
  - --talk-name=org.freedesktop.ScreenSaver
  - --filesystem=xdg-config/luch:create
  # A privileged luch-kms --serve (fast mode) listens here.
  - --filesystem=xdg-run/luch:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    RUSTFLAGS: -C link-arg=-lavcodec -C link-arg=-lavutil -C link-arg=-ldrm -C link-arg=-lEGL -C link-arg=-lGLESv2 -C link-arg=-lva

modules:
  # Only what luchd and luch-kms use: VA-API H.264 / HEVC encoding on frames imported from DRM.
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --disable-everything
      - --disable-autodetect
      - --enable-vaapi
      - --enable-libdrm
      - --enable-encoder=h264_vaapi
      - --enable-encoder=hevc_vaapi
      - --enable-hwaccel=h264_vaapi
      - --enable-hwaccel=hevc_vaapi
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz
        sha256: 089bc60fb59d6aecc5d994ff530fd0dcb3ee39aa55867849a2bbc4e555f9c304

  - name: luch
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/luchd /app/bin/luchd
      - install -Dm755 target/release/luchctl /app/bin/luchctl
      - install -Dm755 target/release/luch-kms /app/bin/luch-kms
      # The fast-mode helper for hosts where a sandboxed luchd cannot run luch-kms: it runs on the host, so it
      # takes its two libraries along (the rest comes from the host).
      - install -Dm755 target/release/luch-kms /app/share/luch/helper/luch-kms
      - cp -L /app/lib/libavcodec.so.61 /app/lib/libavutil.so.59 /app/share/luch/helper/
      # Steam Deck: the Decky plugin and the setup command.
      - cp -a packaging/flatpak/deck/decky-plugin /app/share/luch/decky-plugin
      - install -Dm755 packaging/flatpak/deck/luch-setup /app/bin/luch-setup
      - mkdir -p /app/share/luch && cp -a packaging/flatpak/deck/plasmoid /app/share/luch/plasmoid
      - install -Dm644 packaging/flatpak/deck/Install-Luch.desktop /app/share/luch/Install-Luch.desktop
      - install -Dm755 packaging/flatpak/deck/deckyheal/luch-deckyheal.sh /app/share/luch/deckyheal/luch-deckyheal.sh
      - install -Dm755 packaging/flatpak/deck/deckyheal/luch-decky-install.sh /app/share/luch/deckyheal/luch-decky-install.sh
      - install -Dm644 packaging/flatpak/deck/deckyheal/luch-deckyheal.service /app/share/luch/deckyheal/luch-deckyheal.service
      - install -Dm644 packaging/flatpak/deck/deckyheal/luch-deckyheal.timer /app/share/luch/deckyheal/luch-deckyheal.timer
      - install -Dm644 assets/luch.png /app/share/luch/luch.png
      - install -Dm644 assets/luch.svg /app/share/icons/hicolor/scalable/apps/toxblh.luch.Luch.svg
      - install -Dm644 packaging/flatpak/deck/toxblh.luch.Luch.desktop /app/share/applications/toxblh.luch.Luch.desktop
      - install -Dm644 packaging/flatpak/deck/toxblh.luch.Luch.Setup.desktop /app/share/applications/toxblh.luch.Luch.Setup.desktop
    sources:
      - type: dir
        path: ../..
        skip: [target, .git, packaging/flatpak/vendor, packaging/flatpak/.flatpak-builder]
      # Mesa radeonsi leaves a flag out of the HEVC slice header: see the patch. Dropped once luch-kms has the fix upstream.
      - type: patch
        path: patches/luch-kms-hevc-pps.patch
      # The helper served one client at a time: a session left running kept the next one waiting (a black picture).
      - type: patch
        path: patches/luch-kms-serve-concurrent.patch
      # HEVC (less data) when the receiver decodes it about as fast as H.264, not only when it is clearly faster.
      - type: patch
        path: patches/luchd-prefer-hevc.patch
      - type: patch
        path: patches/luch-kms-plane-opaque.patch
      # The coded picture is 1088 rows for 1080: the rows below the picture stayed green on receivers that do not crop.
      - type: patch
        path: patches/luch-kms-clear-padding.patch
      # Crates for the offline build: `cargo vendor` at the repo root, see README.md in this directory.
      - type: dir
        path: vendor
        dest: vendor
      - type: inline
        dest: .cargo
        dest-filename: config.toml
        contents: |
          [source.crates-io]
          replace-with = "vendored-sources"
          [source.vendored-sources]
          directory = "vendor"
